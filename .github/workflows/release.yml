name: release

# Pushing a tag like v0.2.0 builds the portable exe and publishes it with its SHA-256,
# which is what the in-app updater downloads and verifies.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Two builds: a small one (needs the .NET 10 Desktop Runtime) and a portable one with .NET inside.
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $common = @('-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', "-p:Version=$version",
                      '-p:DebugType=None', '-p:DebugSymbols=false')

          dotnet publish src/MonitorTv.App @common --self-contained false -o light
          dotnet publish src/MonitorTv.App @common --self-contained true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o portable

          New-Item -ItemType Directory out | Out-Null
          Copy-Item light/ScreenSoundSwitcher.exe out/ScreenSoundSwitcher.exe
          Copy-Item portable/ScreenSoundSwitcher.exe out/ScreenSoundSwitcher-portable.exe
          foreach ($name in 'ScreenSoundSwitcher.exe', 'ScreenSoundSwitcher-portable.exe') {
            $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name" | Out-File -Encoding ascii "out/$name.sha256"
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" out/ScreenSoundSwitcher.exe out/ScreenSoundSwitcher.exe.sha256 out/ScreenSoundSwitcher-portable.exe out/ScreenSoundSwitcher-portable.exe.sha256 --generate-notes
